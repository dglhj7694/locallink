spring:
  application:
    name: community

  datasource:
    url: jdbc:postgresql://localhost:5432/locallink
    username: locallink_user
    password: locallink_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: dGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMTIzNDU2Nzg5MA==
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

file:
  upload-dir: ./uploads
